name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib pystray Pillow pyperclip

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm texttool.spec

      - name: Create installer zip
        run: |
          Compress-Archive -Path dist\texttool\* -DestinationPath TextTool-Windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TextTool-Windows-x86_64
          path: TextTool-Windows-x86_64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TextTool-Windows-x86_64.zip